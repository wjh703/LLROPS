[build-system]
requires = [
    "meson-python>=0.20.0",
    "ninja>=1.13.0",
    "numpy>=2.5.1",
]
build-backend = "mesonpy"

[project]
name = "llrops"
version = "0.1.0"
description = "GROOPS-inspired Lunar Laser Ranging processing system"
requires-python = ">=3.14"
dependencies = [
    "calcephpy>=5.0.0",
    "numpy>=2.5.1",
    "pyerfa>=2.0.1.5",
    "pyyaml>=6.0.3",
    "tqdm>=4.68.4",
]


[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-cov>=7.0.0"]
mpi = ["mpi4py>=4.1.2"]
physics = ["pysolid>=0.3.4"]
plot = ["matplotlib>=3.11.1"]
build = [
    "build>=1.3.0",
    "meson>=1.11.2",
    "meson-python>=0.20.0",
    "ninja>=1.13.0",
]

[project.scripts]
llrops = "llrops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
