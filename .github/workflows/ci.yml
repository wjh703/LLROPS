name: CI

on:
  push:
  pull_request:

jobs:
  test-native-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Sync test and build environments
        run: uv sync --extra test --extra build
      - name: Run tests
        run: uv run pytest
      - name: Build distributions
        run: uv run python -m build --sdist --wheel --outdir dist
      - name: Verify native distribution payload
        run: uv run python scripts/verify_distribution.py dist/*.tar.gz dist/*.whl
